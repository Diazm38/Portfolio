<!doctype html>
<html><head>
<meta charset="UTF-8">
<title>Portfolio</title>
	<style>
		@font-face {
		font-family: Helvetica Neue, serif;
		src: url("HelveticaNeueThin.otf");
		} body {
			background-image:url("gradients.png");
			background-size: cover;
		} h1 {
			text-align: center;
			margin: 25px auto;
			font-size: 40px;
			font-family: "helvetica-neue-lt-pro", sans-serif;
			font-weight: 700;
			color: white;
			text-shadow: 2px 3px 6px rgba(32,130,203,0.5);
		}	#square {
			width: 768px;
			height: 500px;
			background: rgba(255, 255, 255, 0.75);
			padding: 40px auto;
			margin: 24px auto;
			border-radius: 48px;
			border: 1px #BEDDF5;
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-items: flex-start;
		} .coco, .money, .starbucks{
			height: 125px;
			display: block;
			margin: 0 auto;
		} figure {
			height: 125px;
			margin: 50px 50px auto 25px;
		} figcaption {
			align-content: center;
			text-align: center;
			font-family: "helvetica-neue-lt-pro", sans-serif;
			font-weight: 100;
			font-style: normal;
			font-size: 14px;
			color: black;
		}
	</style>
	</head>
	<body>
		<h1>Portfolio</h1>
		<div id="square">

			<figure>
							<a href="Coco Love BillBoard.jpg">
				<img class="coco" src="Coco Love.jpg" />
								</a>
				<figcaption>Coco Love Rebrand</figcaption>
			</figure>	
				<figure>
				<a href="Australian Currency Image.png">					
				<img class="money" src="Australian Currency.png" />
				</a>		
				<figcaption>Australian Currency Redesign</figcaption>
			</figure>


			<figure>
							<a href="starbucks ad.jpg">
				<img class="starbucks" src="starbucks ad thumb.jpg" />
							</a>				
				<figcaption>Starbucks Blueberry Campaign</figcaption>
			</figure>

		</div>
	</body>
</html>
